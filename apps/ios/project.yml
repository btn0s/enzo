name: EnzoPrototype
options:
  bundleIdPrefix: com.btn0s.enzo
  deploymentTarget:
    iOS: "26.1"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.1"
    DEVELOPMENT_TEAM: 3B468RG7H6
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2026.9.7"
targets:
  EnzoPrototype:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSAlarmKitUsageDescription: Enzo schedules a full-screen alarm when the next feed is due.
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
        UIBackgroundModes:
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.btn0s.enzo.prototype
        PRODUCT_NAME: Enzo
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGNING_ALLOWED: true
        CODE_SIGN_ENTITLEMENTS: App/Enzo.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: EnzoLiveActivity
        embed: true
  EnzoLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
      - path: Shared
      - path: App/Secrets.swift
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Enzo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.btn0s.enzo.prototype.live-activity
        PRODUCT_NAME: EnzoLiveActivity
        GENERATE_INFOPLIST_FILE: false
        APPLICATION_EXTENSION_API_ONLY: true
        CODE_SIGNING_ALLOWED: true
        CODE_SIGN_ENTITLEMENTS: LiveActivity/EnzoLiveActivity.entitlements
  EnzoPrototypeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: EnzoPrototype
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.btn0s.enzo.prototype.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGNING_ALLOWED: false
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Enzo.app/Enzo"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  EnzoPrototype:
    build:
      targets:
        EnzoPrototype: all
        EnzoLiveActivity: all
    run:
      config: Debug
    test:
      environmentVariables:
        ENZO_UNIT_TESTING: "1"
      targets:
        - EnzoPrototypeTests
